# Prompt language: en or zh.
prompt_language: en

# Agent implementations. Available values are listed on each line.
# heuristic map/build + mcts combat run with no LLM at all (no MODEL_URL /
# MODEL / API_KEY needed). llm map, winning_path build (card picker plus LLM
# escalation), and llm combat require those three environment variables.
agents:
  map: heuristic        # heuristic | llm
  build: heuristic      # heuristic | winning_path | llm
  combat: mcts          # mcts | llm

run:
  character: IRONCLAD  # IRONCLAD | DEFECT
  ascension: 20        # 0..20
  seed: random         # random, a decimal gym seed, or an exact game seed

  # WIDTHxHEIGHT or fullscreen.
  # 1024x576, 1280x720, 1600x900, 1920x1080, ...
  window_size: 1600x900

  # Load AgentVisualizer and show the HUD. History is always recorded.
  hud: false

  # Additional ModTheSpire mod ids to load from runtime/mods/<ModId>.jar.
  # AchievementEnabler lets Steam achievements unlock while mods are loaded
  # (needs Steam running and runtime/lib/steam_appid.txt, see run_bot.sh).
  # superfastmode multiplies the game clock by 100 and skips animation lerps
  # (gym-sts writes its config on launch); drop it to watch at normal speed.
  extra_mods: [AchievementEnabler, superfastmode]

# Runtime files and native executables. Relative paths start at this file.
paths:
  runtime_dir: runtime  # game lib, mods, temporary files, and bridge output
  log_dir: .            # runs are written below <log_dir>/runs/
  mcts_binary: 3rd/sts_lightspeed/build/battle-sim
  card_eval_binary: 3rd/sts_lightspeed/build/card-reward-eval

# OpenAI-compatible endpoint. Empty values use MODEL_URL and MODEL.
# Keep API_KEY in the environment; do not put it in this file.
# Only read when an agent above is llm or winning_path.
llm:
  base_url:
  model:

# Seconds to wait for each game-bridge response.
communication:
  timeout: 30.0

# Presentation delay before each historical replay action. Use 0 for fastest replay.
replay:
  action_delay_seconds: 0.5

# Combat search budgets (upstream defaults; MCTS quality is kept, pace comes
# from SuperFastMode and from threads). In a measured A0 run MCTS was ~80% of
# wall time with half the searches hitting the 10 s cap; lowering
# max_time_ms/simulations speeds runs up at the cost of play quality.
mcts:
  simulations: 100000          # normal search simulation limit (per thread)
  threads: 8                   # parallel MCTS workers (16-core box; raise to 12-14 when the box is idle)
  max_time_ms: 10000           # normal search time limit
  adaptive_time_ms: 30000      # difficult-state time limit
  adaptive_simulations: 500000 # difficult-state simulation limit
